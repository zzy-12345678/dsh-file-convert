name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Validate tag, lockfile and npm version availability
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME" --check-registry
      - name: Use the pinned npm resolver (also supports OIDC publishing)
        run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - name: Publish to npm via OIDC trusted publishing
        run: npm publish --provenance
      - name: Create GitHub release from the tag
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
