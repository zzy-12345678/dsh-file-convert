<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-file-convert · 本地文件转换</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3d;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #4f8cff; --ok: #3fb968; --err: #e5534b; --warn: #d29922;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa; --panel: #ffffff; --panel-2: #eef1f7; --border: #d8dce6;
      --text: #1c2333; --muted: #5c6478; --accent: #2f6fed; --ok: #1a7f37; --err: #cf222e; --warn: #9a6700;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px 64px;
  }
  header { width: 100%; max-width: 860px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
  #status-line { color: var(--muted); font-size: 13px; }
  #drop {
    width: 100%; max-width: 860px; border: 2px dashed var(--border); border-radius: 14px;
    background: var(--panel); padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  #drop.hover, #drop:hover {
    border-color: var(--accent); background: var(--panel-2);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  #drop .icon { font-size: 40px; display: inline-block; }
  #drop.hover .icon { animation: bob .6s ease infinite alternate; }
  @keyframes bob { to { transform: translateY(-6px) scale(1.08); } }
  #drop .main { font-size: 16px; margin-top: 8px; }
  #drop .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #files { width: 100%; max-width: 860px; margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--shadow);
    transition: border-color .15s; animation: card-in .25s ease;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  @keyframes card-in { from { opacity: 0; transform: translateY(6px); } }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .row.actions { margin-top: 8px; }
  .name { font-weight: 600; word-break: break-all; }
  .size { color: var(--muted); white-space: nowrap; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 240px;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  button:not(:disabled):hover { filter: brightness(1.12); }
  button:not(:disabled):active { transform: translateY(1px); }
  button:disabled { background: var(--border); color: var(--muted); cursor: default; }
  button.link { background: none; color: var(--accent); padding: 0; text-decoration: underline; }
  button.link:not(:disabled):active { transform: none; }
  .progress { height: 6px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 10px; display: none; }
  .progress.on { display: block; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .progress.indeterminate > div {
    width: 30%; transition: none;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: bar-slide 1.1s linear infinite;
  }
  @keyframes bar-slide { from { transform: translateX(-110%); } to { transform: translateX(380%); } }
  .msg { margin-top: 8px; font-size: 13px; display: none; }
  .msg.on { display: block; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .msg.warn { color: var(--warn); }
  .msg.detail { color: var(--muted); }
  .spin {
    display: none; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  .spin.on { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .preview:empty { display: none; }
  .preview img {
    height: 120px; max-width: 100%; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); cursor: zoom-in;
  }
  .lightbox {
    position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden;
    background: rgba(0, 0, 0, .78);
    align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.on { display: flex; }
  .lightbox img {
    /* flex item: never shrink below the zoomed layout size (the automatic
       minimum of a replaced element would pin it to the natural width) */
    flex-shrink: 0;
    border-radius: 10px; box-shadow: var(--shadow);
    background: var(--panel-2); will-change: transform;
  }
  .lightbox .lightbox-close {
    position: absolute; top: 14px; right: 18px; width: 36px; height: 36px; padding: 0;
    font-size: 18px; line-height: 1; border-radius: 50%;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  }
  .lightbox .lightbox-close:hover { filter: none; background: var(--panel); }
  .lightbox-bar {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .lightbox-tool {
    min-width: 32px; height: 32px; padding: 0 10px; font-size: 16px; line-height: 1;
    white-space: nowrap; border-radius: 8px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border);
  }
  .lightbox-tool:hover { filter: none; background: var(--panel); }
  .lightbox-zoom { color: var(--muted); font-size: 12px; min-width: 44px; text-align: center; }
  .downloads { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .downloads:empty { display: none; }
  .downloads a { color: var(--accent); text-decoration: none; font-size: 13px; word-break: break-all; }
  .downloads a:hover { text-decoration: underline; }
  footer { width: 100%; max-width: 860px; margin-top: 28px; color: var(--muted); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>dsh-file-convert <small>本地优先 · 文件不出本机</small></h1>
  <div id="status-line">正在加载能力矩阵…</div>
</header>

<div id="drop" role="button" aria-label="拖入或点击选择文件">
  <div class="icon">📥</div>
  <div class="main">把文件拖到这里</div>
  <div class="sub">或点击选择文件 · 支持多选 · 一次转换一个，自动排队</div>
</div>
<input id="picker" type="file" multiple hidden>

<div id="files"></div>

<footer>
  转换在本机完成（图片/PDF/数据开箱即用；音视频/Office/PDF 压缩依赖本机已安装的 ffmpeg / LibreOffice / Ghostscript）。
  上传仅发送到本机 127.0.0.1 服务，超时上限与大小限制见服务端配置。
</footer>

<script>
const TOKEN = '__DSH_UI_TOKEN__';
/** Mount prefix of this UI ('' when served standalone at the origin root). */
const BASE = '__DSH_UI_BASE__';
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const filesEl = document.getElementById('files');
const statusLine = document.getElementById('status-line');

/** All capability rows: { from, to, available, experimental, missing[] }. */
let CAPS = [];
/** Client-side default target per source format (first available wins otherwise). */
const PREFERRED = { png: 'jpg', jpg: 'webp', webp: 'png', svg: 'png', pdf: 'png',
  docx: 'pdf', pptx: 'pdf', xlsx: 'pdf', mp4: 'mp3', mov: 'mp4', wav: 'mp3',
  json: 'yaml', yaml: 'json', csv: 'json' };

/** Output extensions worth rendering as an inline thumbnail preview. */
const IMAGE_OUTPUTS = new Set(['png', 'jpg', 'jpeg', 'webp', 'gif']);

/** 中文主文案：按错误码映射；英文原始 message 作为技术细节展示。 */
const CODE_TEXT = {
  unsupported_conversion: '不支持的转换',
  missing_dependency: '缺少外部依赖',
  invalid_input: '输入无效',
  output_exists: '输出文件已存在',
  timeout: '转换超时',
  cancelled: '已取消',
  conversion_failed: '转换失败',
};

/** DOM helper: the page never assigns innerHTML, so file names and server
 *  strings can never re-enter the parser (CodeQL js/xss via innerHTML). */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

const queue = [];
let running = false;

/** In-page viewer for result images: close button, wheel/button/double-click
 *  zooming and drag panning when zoomed past the viewport. */
const lightbox = el('div', 'lightbox');
const lightboxImg = el('img');
const lightboxClose = el('button', 'lightbox-close', '✕');
lightboxClose.setAttribute('aria-label', '关闭预览');
const zoomLabel = el('span', 'lightbox-zoom', '100%');
const zoomInBtn = el('button', 'lightbox-tool', '＋');
zoomInBtn.setAttribute('aria-label', '放大');
const zoomOutBtn = el('button', 'lightbox-tool', '−');
zoomOutBtn.setAttribute('aria-label', '缩小');
const zoomResetBtn = el('button', 'lightbox-tool', '适应窗口');
zoomResetBtn.setAttribute('aria-label', '重置缩放');
const zoomBar = el('div', 'lightbox-bar');
zoomBar.append(zoomOutBtn, zoomLabel, zoomInBtn, zoomResetBtn);
lightbox.append(lightboxImg, zoomBar, lightboxClose);
document.body.appendChild(lightbox);

let zoomScale = 1;
let panX = 0;
let panY = 0;

function applyZoom() {
  layoutImageSize();
  lightboxImg.style.transform = `translate(${panX}px, ${panY}px)`;
  lightboxImg.style.cursor = zoomScale > 1 ? 'grab' : 'zoom-in';
  zoomLabel.textContent = Math.round(zoomScale * 100) + '%';
}

/** Size the <img> itself at the zoomed pixel size instead of transform-scaling
 *  the fitted-down raster: the browser resamples from the source image on every
 *  step, so magnified previews stay sharp. */
function layoutImageSize() {
  const nw = lightboxImg.naturalWidth;
  const nh = lightboxImg.naturalHeight;
  if (!nw || !nh) return;
  const fit = Math.min(0.92 * window.innerWidth / nw, 0.90 * window.innerHeight / nh, 1);
  lightboxImg.style.width = `${nw * fit * zoomScale}px`;
}

/** Keep the zoomed image from being dragged entirely off screen. */
function clampPan() {
  if (zoomScale <= 1) { panX = 0; panY = 0; return; }
  const rect = lightboxImg.getBoundingClientRect();
  const maxX = Math.max(0, (rect.width - window.innerWidth) / 2 + 24);
  const maxY = Math.max(0, (rect.height - window.innerHeight) / 2 + 24);
  panX = Math.min(maxX, Math.max(-maxX, panX));
  panY = Math.min(maxY, Math.max(-maxY, panY));
}

function zoomTo(scale) {
  zoomScale = Math.min(8, Math.max(0.2, scale));
  clampPan();
  applyZoom();
}

function resetZoom() {
  zoomScale = 1; panX = 0; panY = 0;
  applyZoom();
}

lightboxImg.onload = () => { if (lightbox.classList.contains('on')) applyZoom(); };

function openLightbox(src) {
  lightboxImg.src = src;
  resetZoom();
  lightbox.classList.add('on');
  // Cached blobs complete before onload can fire; lay them out immediately.
  if (lightboxImg.complete && lightboxImg.naturalWidth) applyZoom();
}
function closeLightbox() {
  lightbox.classList.remove('on');
  lightboxImg.src = '';
  resetZoom();
}
lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
lightbox.addEventListener('wheel', (e) => {
  if (!lightbox.classList.contains('on')) return;
  e.preventDefault();
  zoomTo(zoomScale * (e.deltaY < 0 ? 1.2 : 1 / 1.2));
}, { passive: false });
lightboxImg.addEventListener('dblclick', () => zoomTo(zoomScale > 1 ? 1 : 2.5));
zoomInBtn.addEventListener('click', () => zoomTo(zoomScale * 1.25));
zoomOutBtn.addEventListener('click', () => zoomTo(zoomScale / 1.25));
zoomResetBtn.addEventListener('click', resetZoom);

// Drag to pan while zoomed; pointer capture keeps the drag alive off-element.
let panning = false;
let lastPX = 0;
let lastPY = 0;
lightboxImg.addEventListener('pointerdown', (e) => {
  if (zoomScale <= 1) return;
  panning = true;
  lastPX = e.clientX;
  lastPY = e.clientY;
  lightboxImg.setPointerCapture(e.pointerId);
  lightboxImg.style.cursor = 'grabbing';
});
lightboxImg.addEventListener('pointermove', (e) => {
  if (!panning) return;
  panX += e.clientX - lastPX;
  panY += e.clientY - lastPY;
  lastPX = e.clientX;
  lastPY = e.clientY;
  clampPan();
  applyZoom();
});
const endPan = () => {
  panning = false;
  if (zoomScale > 1) lightboxImg.style.cursor = 'grab';
};
lightboxImg.addEventListener('pointerup', endPan);
lightboxImg.addEventListener('pointercancel', endPan);

window.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('on')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === '+' || e.key === '=') zoomTo(zoomScale * 1.25);
  else if (e.key === '-' || e.key === '_') zoomTo(zoomScale / 1.25);
  else if (e.key === '0') resetZoom();
});

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

function extOf(name) {
  const m = /\.([a-z0-9]+)$/i.exec(name);
  if (!m) return '';
  const e = m[1].toLowerCase();
  return { jpeg: 'jpg', yml: 'yaml', htm: 'html' }[e] || e;
}

/** A stale page (server restarted) holds an old token; reload once to pick up a fresh one. */
function reloadForFreshToken() {
  if (sessionStorage.getItem('dsh-ui-stale')) return false;
  sessionStorage.setItem('dsh-ui-stale', '1');
  location.reload();
  return true;
}

/** Cards created before the capability matrix arrived; their selects are
 *  rebuilt once loadCaps finally fills CAPS (dropping a file within the first
 *  moments of the page, or after a failed load, must not strand an empty picker). */
const pendingSelects = [];

function rebuildTarget(state) {
  const sel = targetOptions(extOf(state.file.name));
  state.sel.replaceWith(sel);
  state.sel = sel;
}

async function loadCaps() {
  const res = await fetch(BASE + '/api/conversions', { headers: { 'x-dsh-token': TOKEN } });
  if (res.status === 403 && reloadForFreshToken()) return;
  const data = await res.json();
  CAPS = data.conversions || [];
  const available = CAPS.filter(c => c.available).length;
  statusLine.textContent = `共 ${CAPS.length} 种转换，本机可用 ${available} 种 · 单次超时 ${data.limits?.timeoutMinutes ?? 30} 分钟 · 上限 ${fmtBytes(data.limits?.maxUploadBytes ?? 0)}`;
  sessionStorage.removeItem('dsh-ui-stale');
  for (const state of pendingSelects.splice(0)) rebuildTarget(state);
}

/** Drives the status line and offers a retry when the matrix cannot load. */
function loadCapsShown() {
  statusLine.textContent = '正在加载能力矩阵…';
  loadCaps().catch(() => {
    statusLine.textContent = '无法加载能力矩阵（服务未就绪？）';
    const retry = el('button', 'link', '重试');
    retry.addEventListener('click', loadCapsShown);
    statusLine.append(' ', retry);
  });
}

function targetOptions(fromGuess) {
  const groups = new Map();
  for (const cap of CAPS) {
    if (!groups.has(cap.from)) groups.set(cap.from, []);
    groups.get(cap.from).push(cap);
  }
  // Show the dropped file's own source format first so it is one glance away;
  // the other groups keep their original order behind it.
  const ordered = [...groups.entries()].sort((a, b) =>
    (b[0] === fromGuess) - (a[0] === fromGuess));
  const sel = document.createElement('select');
  const placeholder = el('option', null, '选择目标格式');
  placeholder.value = '';
  placeholder.disabled = true;
  placeholder.selected = true;
  sel.appendChild(placeholder);
  for (const [from, caps] of ordered) {
    const group = el('optgroup');
    group.label = `源格式 ${from}`;
    for (const cap of caps) {
      if (!cap.available) continue;
      const option = el('option', null, `${from} → ${cap.to}${cap.experimental ? '（实验）' : ''}`);
      option.value = `${from}>${cap.to}`;
      group.appendChild(option);
    }
    sel.appendChild(group);
  }
  const preferred = PREFERRED[fromGuess];
  const guessed = preferred && CAPS.some(c => c.from === fromGuess && c.to === preferred && c.available);
  if (guessed) sel.value = `${fromGuess}>${preferred}`;
  return sel;
}

function addFiles(list) {
  for (const file of list) {
    if (!file) continue;
    const card = el('div', 'card');
    const name = file.name;

    const rowTop = el('div', 'row');
    const nameEl = el('span', 'name', name);
    const sizeEl = el('span', 'size', fmtBytes(file.size));
    const spacer = el('span', 'spacer');
    spacer.style.flex = '1';
    rowTop.append(nameEl, sizeEl, spacer);

    const rowActions = el('div', 'row actions');
    const targetSlot = el('span', 'target-slot');
    const goBtn = el('button', 'go', '开始转换');
    const rmBtn = el('button', 'remove link', '移除');
    rowActions.append(targetSlot, goBtn, rmBtn);

    const progress = el('div', 'progress');
    const bar = el('div');
    progress.appendChild(bar);

    const msg = el('div', 'msg');
    const spinner = el('span', 'spin');
    const msgText = el('span', 'msg-text');
    msg.append(spinner, msgText);

    const preview = el('div', 'preview');
    const downloads = el('div', 'downloads');
    card.append(rowTop, rowActions, progress, msg, preview, downloads);

    const sel = targetOptions(extOf(name));
    targetSlot.replaceWith(sel);

    // The card state doubles as the queue job; `phase` drives the buttons.
    // Always read the picker through state.sel: a late capability load
    // replaces the select node (rebuildTarget), so closures must not hold it.
    const state = { file, card, sel, msg, spinner, msgText, progress, bar,
      preview, downloads, goBtn, rmBtn, phase: 'idle', xhr: null, to: '', urls: [] };
    if (!CAPS.some(c => c.available)) pendingSelects.push(state);

    const clearResults = () => {
      // URLs die here, so never leave the viewer showing a revoked image.
      closeLightbox();
      for (const url of state.urls) URL.revokeObjectURL(url);
      state.urls = [];
      preview.replaceChildren();
      downloads.replaceChildren();
      for (const extra of card.querySelectorAll('.msg-extra')) extra.remove();
    };

    goBtn.addEventListener('click', () => {
      if (state.phase !== 'idle' && state.phase !== 'done') return;
      if (!state.sel.value) { setMsg(state, '请先选择目标格式。', 'err', false); return; }
      clearResults();
      state.to = state.sel.value.split('>')[1];
      state.phase = 'queued';
      goBtn.disabled = true;
      rmBtn.textContent = '取消';
      queue.push(state);
      updateQueuePositions();
      pump();
    });

    rmBtn.addEventListener('click', () => {
      if (state.phase === 'queued') {
        const index = queue.indexOf(state);
        if (index !== -1) queue.splice(index, 1);
        updateQueuePositions();
        clearResults();
        card.remove();
      } else if (state.phase === 'running') {
        state.xhr?.abort();
      } else {
        clearResults();
        card.remove();
      }
    });

    filesEl.appendChild(card);
  }
}

function setMsg(job, text, kind, spinning) {
  job.msg.className = 'msg on' + (kind ? ' ' + kind : '');
  job.msgText.textContent = text;
  job.spinner.classList.toggle('on', !!spinning);
}

/** Refresh the "queued" cards so positions stay truthful as the queue moves. */
function updateQueuePositions() {
  queue.forEach((job, index) => {
    if (job.phase !== 'queued') return;
    setMsg(job, index === 0 ? '即将开始…' : `排队中 · 前面还有 ${index} 个`, '', false);
  });
}

function pump() {
  if (running) return;
  const job = queue.shift();
  if (!job) return;
  running = true;
  convert(job).finally(() => {
    running = false;
    updateQueuePositions();
    pump();
  });
}

function convert(job) {
  return new Promise((resolve) => {
    const { file, card, sel, progress, bar, downloads, preview, goBtn, rmBtn, to } = job;
    const fail = (main, detail) => {
      progress.classList.remove('on', 'indeterminate');
      card.querySelector('.raw-detail')?.remove();
      setMsg(job, main, 'err', false);
      if (detail) {
        const raw = el('div', 'msg on detail raw-detail', detail);
        card.appendChild(raw);
      }
      job.phase = 'idle';
      goBtn.disabled = false;
      rmBtn.textContent = '移除';
      resolve();
    };

    job.phase = 'running';
    setMsg(job, '上传中 0%', '', false);
    progress.classList.add('on');
    progress.classList.remove('indeterminate');
    bar.style.width = '0%';

    const xhr = new XMLHttpRequest();
    job.xhr = xhr;
    xhr.open('POST', BASE + `/api/convert?name=${encodeURIComponent(file.name)}&to=${encodeURIComponent(to)}`);
    xhr.setRequestHeader('x-dsh-token', TOKEN);
    xhr.responseType = 'json';
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      bar.style.width = pct + '%';
      setMsg(job, `上传中 ${pct}%`, '', false);
    };
    xhr.upload.onload = () => {
      progress.classList.add('indeterminate');
      setMsg(job, '转换中…', '', true);
    };
    xhr.onerror = () => fail('网络错误：本地服务无响应。');
    xhr.onabort = () => fail('已取消。');
    xhr.onload = () => {
      if (xhr.status === 403 && reloadForFreshToken()) return;
      progress.classList.remove('on', 'indeterminate');
      const data = xhr.response || {};
      if (xhr.status !== 200 && !data.ok) {
        return fail(`服务错误（HTTP ${xhr.status}）`, data.error);
      }
      if (!data.ok) {
        job.phase = 'idle';
        goBtn.disabled = false;
        rmBtn.textContent = '移除';
        // The server reports the real detected source format; align the picker.
        if (data.from) {
          const wanted = `${data.from}>`;
          const opt = [...sel.options].find(o => o.value.startsWith(wanted));
          if (opt) { sel.value = opt.value; }
        }
        return fail(`${CODE_TEXT[data.code] || '转换失败'}：`, [data.message, data.hint].filter(Boolean).join(' '));
      }
      bar.style.width = '100%';
      for (const f of data.files) {
        const link = el('a', null, `⬇ ${f.name}（${fmtBytes(f.bytes)}）`);
        link.href = f.url;
        link.download = '';
        downloads.appendChild(link);
        if (!IMAGE_OUTPUTS.has(extOf(f.name))) continue;
        fetch(f.url)
          .then(res => res.ok ? res.blob() : Promise.reject(res.status))
          .then(blob => {
            const url = URL.createObjectURL(blob);
            job.urls.push(url);
            const thumb = el('img');
            thumb.src = url;
            thumb.alt = f.name;
            thumb.title = '点击查看大图';
            thumb.addEventListener('click', () => openLightbox(url));
            preview.appendChild(thumb);
          })
          .catch(() => { /* preview is best-effort; the download link remains */ });
      }
      const note = `完成：${data.from} → ${data.to}，${fmtBytes(data.bytesIn)} → ${fmtBytes(data.bytesOut)}，用时 ${(data.durationMs / 1000).toFixed(1)}s`;
      setMsg(job, note, 'ok', false);
      if (data.warnings && data.warnings.length) {
        card.appendChild(el('div', 'msg on warn msg-extra', '⚠ ' + data.warnings.join('；')));
      }
      job.phase = 'done';
      // Stay enabled: the same file can pick another target and convert again.
      goBtn.disabled = false;
      rmBtn.textContent = '移除';
      resolve();
    };
    xhr.send(file);
  });
}

drop.addEventListener('click', () => picker.click());
picker.addEventListener('change', () => { addFiles(picker.files); picker.value = ''; });
for (const type of ['dragenter', 'dragover']) {
  drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add('hover'); });
}
for (const type of ['dragleave', 'drop']) {
  drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove('hover'); });
}
drop.addEventListener('drop', (e) => {
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});
// Keep the page itself from navigating when a file misses the zone.
for (const type of ['dragover', 'drop']) {
  window.addEventListener(type, (e) => e.preventDefault());
}

loadCapsShown();
</script>
</body>
</html>
